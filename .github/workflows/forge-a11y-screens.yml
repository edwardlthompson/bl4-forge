# A11y + screenshot diff CI (Playwright) for forge web.
name: Forge a11y screens

on:
  pull_request:
    paths:
      - "examples/web/**"
      - ".github/workflows/forge-a11y-screens.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Playwright a11y / screens
        run: npx playwright test --project=chromium
        env:
          CI: true
