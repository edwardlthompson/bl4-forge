# Sharded leaderboard sweep matrix (opt-in; no game install in CI).
name: Sweep matrix

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: examples/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit (sweep + solver)
        run: npx vitest run src/sweep src/solver --coverage=false
      - name: Shard stamp
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards || 4 }}
        run: |
          echo "shard=${SHARD} of ${SHARDS}"
          mkdir -p ../../leaderboards/scaffold/shards
          echo "{\"shard\":${SHARD},\"status\":\"unit-ok\"}" > "../../leaderboards/scaffold/shards/shard-${SHARD}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-shard-${{ matrix.shard }}
          path: leaderboards/scaffold/shards/shard-${{ matrix.shard }}.json
